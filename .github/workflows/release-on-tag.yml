name: Release tagged engine

on:
  push:
    tags:
      # `X.Y.Z` is the format; `v*` stays so the 21 tags up to v1.2.1 and any
      # re-run of them still work. See CONTRIBUTING / AGENTS on the app side.
      - "[0-9]*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing X.Y.Z tag to publish as a GitHub Release (a leading v is accepted for the older ones)"
        required: true
        type: string

# `id-token: write` is the whole point: npm trusted publishing trades a GitHub
# OIDC token for a short-lived publish credential, so no npm token is stored
# anywhere — not in a repo secret, not in a developer's ~/.npmrc. It grants no
# write access to anything else. `contents: write` is for creating the Release.
#
# This replaces publishing by hand. That route needed an npm account credential
# on someone's machine, which meant either a long-lived token with "bypass 2FA"
# — a plaintext file that can ship native code to every Yuzic install — or a
# security-key prompt that cannot be answered from a phone, which is how 1.3.0
# nearly got stuck.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an X.Y.Z tag, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      # Node 24, not the 20 the checks use. Trusted publishing needs npm 11.5.1
      # or later and Node 22.14 or later; Node 22 still bundles npm 10.9.9,
      # which would fail asking for a token — the exact thing this avoids. Node
      # 24 bundles npm 11.19.1 and clears both floors without a global upgrade.
      # Self-hosted runners are not supported by trusted publishing; this is a
      # GitHub-hosted one.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # npm's own trusted-publishing example carries this, so it stays.
          # Whether it is strictly required here is untested: the one run
          # without it failed, but that run also predated the npmjs.com
          # publisher being saved, which turned out to be the actual cause of
          # every failure. Do not read that run as evidence either way.
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci

      - name: Verify tag and package.json agree
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "package.json is $SOURCE_VERSION but the tag says $VERSION" >&2
            exit 1
          fi

      # Re-running an old tag must not fail on its own earlier publish. Every
      # tag up to 1.3.0 was published by hand before this step existed, so for
      # those the registry already has the version and there is nothing to do.
      # A publish that should have happened and did not still fails loudly,
      # because `npm publish` rejects a version that is already there.
      # When the registry rejects the OIDC exchange, npm falls back to ordinary
      # token auth and reports that instead: ENEEDAUTH with no registry
      # configured, a bare 404 on the PUT with one. Neither mentions OIDC, and
      # four runs went into telling those apart. This separates "the run cannot
      # mint a token" from "npm would not accept it", which is the fork that
      # was impossible to see from the errors alone.
      - name: Confirm the run can mint an OIDC token
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "This job has no OIDC token endpoint, so npm cannot authenticate." >&2
            echo "'id-token: write' is requested but was not granted to the run." >&2
            exit 1
          fi
          echo "OIDC token endpoint is present."

      - name: Publish to npm
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          PUBLISHED="$(npm view "yuzic-engine@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "npm already serves $VERSION; nothing to publish."
            exit 0
          fi
          # No NODE_AUTH_TOKEN and no .npmrc: the OIDC exchange supplies the
          # credential. Provenance is attested automatically, because the repo
          # and the package are both public.
          npm publish

      # The release page carries the CHANGELOG entry for the version, not a
      # generated list of commits. `--generate-notes` produced a body that was
      # one line — "**Full Changelog**: compare/1.3.1...1.3.2" — while the
      # entry someone had written by hand sat in CHANGELOG.md and reached
      # nobody who was not reading the repository.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          # Everything under `## [X.Y.Z]` up to the next `## [`, with blank
          # lines trimmed off both ends.
          awk -v ver="$VERSION" '
            $0 == "## [" ver "]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          # Strip blank lines from both ends.
          sed -e '/./,$!d' /tmp/notes.md | tac | sed -e '/./,$!d' | tac > /tmp/notes.body.md

          if [ ! -s /tmp/notes.body.md ]; then
            # Loud rather than silent: a release with no entry is a changelog
            # that was not written, and the generated list is the fallback
            # rather than the plan.
            echo "::warning::CHANGELOG.md has no '## [$VERSION]' section; falling back to generated notes."
            gh release create "$TAG" \
              --title "yuzic-engine $VERSION" \
              --generate-notes
            exit 0
          fi

          # The compare link `--generate-notes` would have added, kept. The
          # previous release is whatever is newest right now, since this one
          # does not exist yet.
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: %s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$PREV" "$TAG" >> /tmp/notes.body.md
          fi

          gh release create "$TAG" \
            --title "yuzic-engine $VERSION" \
            --notes-file /tmp/notes.body.md
