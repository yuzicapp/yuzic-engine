name: Release tagged engine

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish as a GitHub Release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      # The registry is not read-your-writes. `npm publish` returns success and
      # `npm view` can still answer with the *previous* version for a couple of
      # minutes afterwards — measured at about 2.5 minutes on 1.0.12. Asking
      # once therefore fails a release that is perfectly fine, which is exactly
      # what happened to the v1.0.11 tag: it was pushed straight after the
      # publish, this step read the old version, and the run had to be
      # re-dispatched by hand once the registry caught up.
      #
      # So it waits rather than deciding on the first answer. Five minutes in
      # fifteen-second steps, and it still fails if the version genuinely never
      # appears — this is a retry on propagation delay, not a way of passing a
      # check that should fail.
      - name: Verify tag and npm package agree
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "package.json is $SOURCE_VERSION but the tag says $VERSION" >&2
            exit 1
          fi

          DEADLINE=$(( $(date +%s) + 300 ))
          while :; do
            PUBLISHED_VERSION="$(npm view "yuzic-engine@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
              echo "npm serves $VERSION"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "npm still does not serve yuzic-engine@$VERSION after 5 minutes." >&2
              echo "Publish it before pushing the tag; this step does not publish." >&2
              exit 1
            fi
            echo "npm does not serve $VERSION yet; waiting for the registry to catch up."
            sleep 15
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --title "yuzic-engine ${TAG#v}" \
            --generate-notes
